# COCO-Stuff (27-class protocol) -- RGLP refinement.
# Labels follow the 27-class merge, not the 171-class protocol.
# Run with:  python tools/test.py --cfg config/coco_stuff27_rglp.yaml --model_module model.model_sfp_dtlr
DATASET:
  NAME: 'stuff'
  NUM_CLASSES: 27
  DATAROOT: 'data/COCOStuff27/'
  SCALE: [2048, 512]
  RATIO_RANGE: [0.5, 2.0]
  CROP_SIZE: [512, 512]
  CAT_MAX_RATIO: 0.75
  IMG_NORM_CFG:
    MEAN: [122.771, 116.746, 104.094]
    STD: [68.501, 66.632, 70.323]
    RGB: True
  TEXT_WEIGHT: 'text/stuff27_ViT16_clip_text.pth'
  REDUCE_ZERO_LABEL: FALSE

MODEL:
  FEATURE_EXTRACTOR: 'vit'
  TEXT_CHANNEL: 512
  VISUAL_CHANNEL: 768
  TRAINING: False
  SFP_DTLR:
    # Source-selected profile, identical to config/voc_rglp.yaml. No COCO-Stuff tuning.
    TOP_FRACTION: 0.75
    DTLR_SIGMA_S_REL: 2.3
    DTLR_BETA: 1.0
    PROXY_LAMBDA: 1.0
    DTLR_STRUCTURE_CLASSES: []
    # Absolute reliability gates (listed for transparency; equal to the code defaults):
    CONF_THD: 0.97
    CONF_SCALE: 10.0
    PROXY_CONF_THD: 0.95
    PROXY_KERNEL: 5

TEST:
  BATCH_SIZE: 1
  PD: 0.85
  ReCLIP_PD: 0.6

EVAL_METRIC: "miou"
SAVE_DIR: "outputs/coco_stuff27_rglp/"
LOAD_PATH: "weights/coco_stuff27/best_weight.pth"
NUM_WORKERS: 4
